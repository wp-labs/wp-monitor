allow_slugs:
  - "**"

include:
  - ./.openapi.yml

.common-pipeline:
  - services:
        - docker
    imports: https://cnb.cool/dy-sec/s-devkit/ci-private-env/-/blob/master/envs.yml
    docker:
      image:
        name: maven:3.9.11-eclipse-temurin-21
        dockerUser: cnb
        dockerPassword: $PIPELINE_CNB_TOKEN
        volumes:
          - /root/.m2:cow
  - stages:
      - name: check
        script:
          - java -version
          - mvn -version
          # - mvn checkstyle:check -s ./settings.xml
          # - mvn spotbugs:check -s ./settings.xml
      - name: build
        script:
          - mvn clean package -DskipTests -s ./settings.xml
      - name: test
        script:
          - mvn test -s ./settings.xml

"(main|master|develop|hotfix/*|feature/*|release/*)":
  push:
    - services:
        - docker
      imports: !reference [.common-pipeline, "0", imports]
      docker: !reference [.common-pipeline, "0", docker]
      stages:
        - !reference [.common-pipeline, "1", stages, "0"]
        - !reference [.common-pipeline, "1", stages, "1"]
        - !reference [.common-pipeline, "1", stages, "2"]
        - name: build-sonar
          script:
            - mvn clean verify sonar:sonar -Dsonar.projectKey=${CNB_REPO_NAME} -Dsonar.projectName=${CNB_REPO_NAME} -Dsonar.host.url=https://sonar.corp.dy-sec.com -Dsonar.token=sqa_99a6edab0803cac18685adbdb062f564431041c1 -s ./settings.xml
          allowFailure: true

# 获取服务版本
.pipeline-get-maturity: &pipeline-get-maturity
- name: get maturity
  script:
    - MATURITY=$(case $CNB_BRANCH in *alpha*) echo alpha ;; *beta*) echo beta ;; *stable*) echo stable ;; esac)
    - echo $MATURITY
  exports:
    stdout: MATURITY

